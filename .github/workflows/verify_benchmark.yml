name: Verify Decode Outputs & Render Benchmark Figures

on:
  push:
    paths:
      - "figures/**"
      - "studies/**/results/**"
      - "studies/**/data/splits/**"
      - "docs/20261124_repository_migration/archived_files.csv"
      - ".github/workflows/verify_benchmark.yml"
  pull_request:
    paths:
      - "figures/**"
      - "studies/**/results/**"
      - ".github/workflows/verify_benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification dependencies
        run: pip install "numpy==1.26.4" "matplotlib>=3.8.0" "PyYAML>=6.0.1" "editdistance>=0.8.0"
      - name: Verify original archive checksums
        run: |
          python - <<'PY'
          import csv
          import hashlib
          from pathlib import Path

          with Path("docs/20261124_repository_migration/archived_files.csv").open(newline="") as stream:
              for row in csv.DictReader(stream):
                  digest = hashlib.sha256(Path(row["new_path"]).read_bytes()).hexdigest()
                  if digest != row["sha256"]:
                      raise SystemExit(f"Archive checksum mismatch: {row['new_path']}")
          PY
      - name: Rebuild the figures and compare published numeric tables
        run: |
          build="$RUNNER_TEMP/benchmark"
          python figures/code/build_figures.py --output-dir "$build"
          published="figures/results/20261124_repository_migration"
          for file in session_per_vs_wer.json session_cer_vs_wer.json figure2ef_bars.csv figure3ab_session_points.csv figure3cd_memory.csv; do
            diff -u "$published/$file" "$build/$file"
          done
