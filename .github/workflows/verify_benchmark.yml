name: Verify Decode Outputs & Render Figure 2

on:
  push:
    paths:
      - "reproduction_benchmark.yaml"
      - "render_figure2.py"
      - "build_session_per_vs_wer.py"
      - "**/results/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recompute session-level PER vs. WER and render Figure 2
        run: |
          python build_session_per_vs_wer.py
          python render_figure2.py

      - name: Commit updated artifacts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reproduction_benchmark.json session_per_vs_wer.json communication_neuroprostheses_reproduction.png communication_neuroprostheses_reproduction.pdf
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-render Figure 2 and sync JSON artifacts"
            git push
          fi
